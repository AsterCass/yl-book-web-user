<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var GA_ID = '%VITE_GA_ID%';
        if (!/^G-[A-Z0-9]+$/.test(GA_ID)) return;
        var optedOut = navigator.globalPrivacyControl === true;
        try {
          optedOut = optedOut || localStorage.getItem('adOptOut') === '1';
        } catch (e) {}
        if (optedOut) return;

        // ?ads=no 暂不生效（2026-11-16）：本标签页不加载 GA / Meta Pixel 的规则。要启用时去掉下面这段的注释，
        // 并同步切换 src/utils/pixel.js 的 initPixel 与 landing-params.js
        /*
        var adsParam = new URLSearchParams(location.search).get('ads');
        var noAds = (adsParam || '').trim().toLowerCase() === 'no';
        try {
          if (adsParam !== null) {
            if (noAds) sessionStorage.setItem('zyy_ads', 'no');
            else sessionStorage.removeItem('zyy_ads');
          } else {
            noAds = sessionStorage.getItem('zyy_ads') === 'no';
          }
        } catch (e) {}
        if (noAds) return;
        */

        var zyyStore = (new URLSearchParams(location.search).get('store') || '').trim();
        try {
          if (zyyStore) sessionStorage.setItem('zyy_store', zyyStore);
          else zyyStore = sessionStorage.getItem('zyy_store') || '';
        } catch (e) {}
        if (!zyyStore) return;

        var zyyAdsValue = (new URLSearchParams(location.search).get('ads') || '').trim().toLowerCase();
        try {
          if (zyyAdsValue) sessionStorage.setItem('zyy_ads_value', zyyAdsValue);
          else zyyAdsValue = sessionStorage.getItem('zyy_ads_value') || '';
        } catch (e) {}

        var tag = document.createElement('script');
        tag.async = true;
        tag.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
        document.head.appendChild(tag);

        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('set', { store: zyyStore, ads: zyyAdsValue || 'yes' });

        window.gtag('config', GA_ID, { cookie_expires: 60 * 60 * 24 * 365 });

        // Google Ads 转化（2026-11-19）：和 GA 共用上面这一份 gtag.js，加载条件也完全相同（正式环境、没退出、带了 store）。
        // 这一步会在落地时把网址里的广告点击标识（gclid）记进本站 cookie，预约成功时 Ads 才对得上是哪次点击带来的。
        // allow_ad_personalization_signals: false = 只做转化衡量，不拿访问数据建再营销受众（隐私政策）
        var ADS_ID = '%VITE_GADS_ID%';
        if (/^AW-[0-9]+$/.test(ADS_ID)) {
          window.gtag('config', ADS_ID, { allow_ad_personalization_signals: false });
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>预约系统</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
